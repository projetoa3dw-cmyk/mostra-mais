<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mostra+ | Login</title>
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="index.css">
</head>
<body class="login-body">

  <main class="login-wrapper">
    
    <!-- LADO ESQUERDO: MARCA E TEXTO INFERIOR (Visível no Computador) -->
    <div class="login-left-content">
      <div class="top-brand">
        <a href="index.html" class="brand-title">MOSTRA+</a>
      </div>
      <div class="bottom-tagline">
        <h1 class="poster-text">
          POSTE SEU<br>
          <span class="highlight-purple">PROJETO!</span>
        </h1>
      </div>
    </div>

    <!-- LADO DIREITO / CENTRALIZADO NO MOBILE: FORMULÁRIO DE LOGIN -->
    <div class="login-right-content">
      
      <!-- Logo exibida apenas no topo da versão celular -->
      <a href="index.html" class="brand-title mobile-brand">MOSTRA+</a>

      <div class="form-container">
        <h2 class="login-header">LOGIN</h2>

        <form action="#" method="POST" class="auth-form">
          <label for="email" class="form-label">Entrar com email :</label>
          <div class="input-group">
            <i class="fa-regular fa-envelope input-icon"></i>
            <input type="email" id="email" class="form-input" placeholder="Yourname@gmail.com" required>
          </div>

          <button type="submit" class="btn-gradient btn-action">Logar</button>
        </form>

        <div class="divider-line"></div>
        <div class="signup-box">
            <p class="signup-text">Não tem conta? Cadastre-se:</p>
            <a href="cadastro.html" class="btn-gradient btn-action" style="text-align: center; text-decoration: none; display: block;">Cadastrar</a>
        </div>
      </div>

    </div>

  </main>

</body>
</html>
