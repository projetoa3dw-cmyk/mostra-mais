<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mostra+ | Cadastro</title>
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="index.css">
</head>
<body class="signup-body">

  <main class="signup-wrapper">
    
    <!-- CONTEÚDO CENTRALIZADO DA PÁGINA DE CADASTRO -->
    <div class="signup-card">
      
      <!-- LOGO TOPO -->
      <a href="index.html" class="brand-title signup-brand">MOSTRA+</a>

      <h2 class="signup-header">CRIAR CONTA</h2>

      <form action="#" method="POST" class="auth-form">
        
        <!-- SELEÇÃO DE PERFIL (ALUNO OU PROFESSOR) -->
        <label class="form-label">Selecione seu perfil :</label>
        <div class="profile-selector">
          <label class="profile-option">
            <input type="radio" name="perfil" value="aluno" checked required>
            <div class="profile-box">
              <i class="fa-solid fa-user-graduate"></i>
              <span>Estudante</span>
            </div>
          </label>

          <label class="profile-option">
            <input type="radio" name="perfil" value="professor" required>
            <div class="profile-box">
              <i class="fa-solid fa-chalkboard-user"></i>
              <span>Professor</span>
            </div>
          </label>
        </div>

        <!-- CAMPO: EMAIL -->
        <label for="email" class="form-label">Insira seu email institucional :</label>
        <div class="input-group">
          <i class="fa-regular fa-envelope input-icon"></i>
          <input type="email" id="email" class="form-input" placeholder="seuemail@ulife.com.br" required>
        </div>

        <!-- CAMPO: CONFIRME EMAIL -->
        <label for="confirm-email" class="form-label">Confirme seu email :</label>
        <div class="input-group">
          <i class="fa-regular fa-envelope input-icon"></i>
          <input type="email" id="confirm-email" class="form-input" placeholder="confirme seuemail@ulife.com.br" required>
        </div>

        <!-- CAMPO: SENHA -->
        <label for="password" class="form-label">Senha :</label>
        <div class="input-group">
          <i class="fa-solid fa-lock input-icon"></i>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required>
        </div>

        <!-- CAMPO: CONFIRME SENHA -->
        <label for="confirm-password" class="form-label">Confirme sua senha :</label>
        <div class="input-group">
          <i class="fa-solid fa-lock input-icon"></i>
          <input type="password" id="confirm-password" class="form-input" placeholder="••••••••" required>
        </div>

        <!-- BOTÃO DE FINALIZAR CADASTRO -->
        <button type="submit" class="btn-action btn-signup-submit">Cadastrar</button>
      </form>

      <div class="divider-line"></div>

      <!-- LINK DE RETORNO AO LOGIN -->
      <div class="login-return-box">
        <p class="signup-text">Já possui uma conta?</p>
        <a href="login.html" class="btn-action btn-secondary-login">Fazer Login</a>
      </div>

    </div>

  </main>

</body>
</html>
